name: CI

on:
  push:
    branches: ['**']
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make check-docs
      - run: python3 -m unittest discover -s scripts -p 'test_ci_report.py'

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable]
        include:
          - os: ubuntu-latest
            go: '1.22'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Go vet
        run: go vet ./...
      - name: Go tests, race detection and coverage
        id: tests
        run: |
          mkdir -p generatedtestReports
          set +e
          go test -race -json -coverprofile=generatedtestReports/coverage.out ./... > generatedtestReports/go-test.json
          test_exit=$?
          go tool cover -func=generatedtestReports/coverage.out > generatedtestReports/coverage-summary.txt
          python3 scripts/ci-report.py --input generatedtestReports/go-test.json --output-dir generatedtestReports --exit-code "$test_exit" --coverage-summary generatedtestReports/coverage-summary.txt
          cat generatedtestReports/summary.md >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json; r=json.load(open("generatedtestReports/result.json")); assert r["status"] == "passed", "Go tests or report failed"; assert float(r["coverageTotal"].rstrip("%")) >= 80, "Coverage below 80%"'
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}-go-${{ matrix.go }}-${{ github.sha }}
          path: generatedtestReports/
          if-no-files-found: error
          retention-days: 30

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: make web-test web-build

  required:
    name: Required checks
    if: always()
    needs: [docs, test, web]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json,os; jobs=json.loads(os.environ["RESULTS"]); assert all(j["result"] == "success" for j in jobs.values()), jobs'
