name: npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published stable release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: false
      - name: Validate published stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "npm publishing requires vMAJOR.MINOR.PATCH" >&2; exit 1 ;;
          esac
          version=${RELEASE_TAG#v}
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "npm publishing only accepts stable semantic versions" >&2
            exit 1
          fi
          release=$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName)
          test "$(jq -r .tagName <<<"$release")" = "$RELEASE_TAG"
          test "$(jq -r .isDraft <<<"$release")" = false
          test "$(jq -r .isPrerelease <<<"$release")" = false
      - name: Download release archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/agc-release"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/agc-release" \
            --pattern 'agc-cli_*_darwin_*.tar.gz' \
            --pattern 'agc-cli_*_linux_*.tar.gz' \
            --pattern 'agc-cli_*_windows_*.zip' \
            --pattern checksums.txt
      - name: Build npm package
        run: |
          version=${RELEASE_TAG#v}
          python3 scripts/build-npm-package.py \
            --version "$version" \
            --release-dir "$RUNNER_TEMP/agc-release" \
            --output "$RUNNER_TEMP/npm-package"
          node --test packaging/npm/test/agc.test.cjs
          mkdir -p "$RUNNER_TEMP/npm-artifact"
          npm pack "$RUNNER_TEMP/npm-package" --pack-destination "$RUNNER_TEMP/npm-artifact" --json > "$RUNNER_TEMP/npm-artifact/npm-pack.json"
          python3 -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/npm-artifact/npm-pack.json"))[0]; assert p["name"] == "@createitv/agc-cli"; assert any(x["path"] == "vendor/win32-x64/agc.exe" for x in p["files"])'
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-artifact/
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-artifact
      - name: Install packed CLI without lifecycle scripts
        shell: bash
        run: |
          packages=("$RUNNER_TEMP/npm-artifact"/*.tgz)
          test "${#packages[@]}" -eq 1
          package=${packages[0]}
          npm install --prefix "$RUNNER_TEMP/npm-install" "$package" --ignore-scripts
          node "$RUNNER_TEMP/npm-install/node_modules/@createitv/agc-cli/bin/agc.js" version | tee "$RUNNER_TEMP/npm-version.txt"
          version=${{ github.event.release.tag_name || inputs.tag }}
          grep -F "${version#v}" "$RUNNER_TEMP/npm-version.txt"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: false
      - name: Pin npm with Trusted Publishing support
        run: |
          npm install --global npm@11.6.2
          npm --version
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-artifact
      - name: Publish once and reject integrity drift
        run: |
          version=${RELEASE_TAG#v}
          packages=("$RUNNER_TEMP/npm-artifact"/*.tgz)
          test "${#packages[@]}" -eq 1
          package=${packages[0]}
          candidate_integrity=$(node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))[0]; process.stdout.write(p.integrity)' "$RUNNER_TEMP/npm-artifact/npm-pack.json")
          published_integrity=$(npm view "@createitv/agc-cli@$version" dist.integrity --json 2>/dev/null | tr -d '"\n' || true)
          if test -n "$published_integrity"; then
            test "$candidate_integrity" = "$published_integrity" || { echo "published npm package integrity differs from this release" >&2; exit 1; }
            echo "@createitv/agc-cli@$version already matches the release; skipping immutable version."
          else
            npm publish "$package" --access public
          fi
      - name: Verify registry installation
        run: |
          version=${RELEASE_TAG#v}
          npm install --global "@createitv/agc-cli@$version" --prefix "$RUNNER_TEMP/npm-install" --ignore-scripts
          "$RUNNER_TEMP/npm-install/bin/agc" version | tee "$RUNNER_TEMP/npm-version.txt"
          grep -F "$version" "$RUNNER_TEMP/npm-version.txt"
