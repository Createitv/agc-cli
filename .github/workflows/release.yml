name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check package publisher token
        run: |
          if [ -z "${TAP_GITHUB_TOKEN}" ]; then
            echo "TAP_GITHUB_TOKEN is required for Homebrew, Scoop, and Winget publishing." >&2
            exit 1
          fi
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      - name: Publish install commands
        run: |
          {
            echo "## Install commands"
            echo
            echo "macOS:"
            echo '```bash'
            echo "brew install agccli"
            echo '```'
            echo
            echo "Windows:"
            echo '```powershell'
            echo "scoop bucket add createitv https://github.com/Createitv/scoop-bucket; scoop install agc-cli; agc version"
            echo '```'
            echo
            echo "Winget after Microsoft approval:"
            echo '```powershell'
            echo "winget install --id Createitv.AgcCli -e"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
