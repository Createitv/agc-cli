version: 2

project_name: agc-cli

builds:
  - id: agc
    main: ./cmd/agc
    binary: agc
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/Createitv/agc-cli/cmd/agc/command.version={{.Version}}
      - -X github.com/Createitv/agc-cli/cmd/agc/command.commit={{.Commit}}
      - -X github.com/Createitv/agc-cli/cmd/agc/command.buildDate={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

brews:
  - name: agccli
    repository:
      owner: Createitv
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/Createitv/agc-cli
    description: AppGallery Connect command center
    license: MIT

scoops:
  - name: agc-cli
    repository:
      owner: Createitv
      name: scoop-bucket
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://agccli.app/
    description: AppGallery Connect CLI command center
    license: MIT
    commit_author:
      name: createitv-bot
      email: bot@createitv.com

winget:
  - name: agc-cli
    publisher: Createitv
    package_identifier: Createitv.AgcCli
    package_name: agc CLI
    default_locale: en-US
    publisher_url: https://github.com/Createitv
    publisher_support_url: https://github.com/Createitv/agc-cli/issues/new
    homepage: https://agccli.app/
    license: MIT
    license_url: https://github.com/Createitv/agc-cli/blob/main/LICENSE
    copyright: Copyright Createitv
    short_description: AppGallery Connect CLI command center
    description: agc CLI is a Go command-line tool for AppGallery Connect automation, release dry-runs, profile binding, uploads, reports, local REST workflows, and CI usage.
    tags:
      - appgallery-connect
      - agc
      - huawei
      - harmonyos
      - cli
      - golang
    release_notes_url: https://github.com/Createitv/agc-cli/releases/tag/{{ .Tag }}
    installation_notes: Run agc version after install to verify the command is available.
    repository:
      owner: Createitv
      name: winget-pkgs
      branch: agc-cli-{{ .Version }}
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
    commit_author:
      name: createitv-bot
      email: bot@createitv.com

dockers:
  - image_templates:
      - ghcr.io/createitv/agc-cli:{{ .Version }}-amd64
      - ghcr.io/createitv/agc-cli:latest-amd64
    dockerfile: Dockerfile
    use: buildx
    goos: linux
    goarch: amd64
    build_flag_templates:
      - --platform=linux/amd64
  - image_templates:
      - ghcr.io/createitv/agc-cli:{{ .Version }}-arm64
      - ghcr.io/createitv/agc-cli:latest-arm64
    dockerfile: Dockerfile
    use: buildx
    goos: linux
    goarch: arm64
    build_flag_templates:
      - --platform=linux/arm64

docker_manifests:
  - name_template: ghcr.io/createitv/agc-cli:{{ .Version }}
    image_templates:
      - ghcr.io/createitv/agc-cli:{{ .Version }}-amd64
      - ghcr.io/createitv/agc-cli:{{ .Version }}-arm64
  - name_template: ghcr.io/createitv/agc-cli:latest
    image_templates:
      - ghcr.io/createitv/agc-cli:latest-amd64
      - ghcr.io/createitv/agc-cli:latest-arm64
